<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="2220" viewBox="0 0 1180 2220" role="img" aria-labelledby="title desc">
  <title id="title">Luồng admin tạo combo sản phẩm</title>
  <desc id="desc">Activity diagram có ba swimlane: Quản trị viên, Giao diện quản trị và Hệ thống Fruitables.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155" />
    </marker>
    <style>
      .page { fill: #f1f5f9; }
      .lane-head { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.2; }
      .lane-body { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .lane-alt { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .lane-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; }
      .ui-node { fill: #eef6ff; stroke: #3b82f6; stroke-width: 1.4; }
      .system-node { fill: #f8fafc; stroke: #64748b; stroke-width: 1.4; }
      .decision { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
      .start-end { fill: #0f172a; stroke: #0f172a; stroke-width: 1; }
      .end-ring { fill: #ffffff; stroke: #0f172a; stroke-width: 3; }
      .text { font: 15px Arial, sans-serif; fill: #1e293b; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #334155; stroke-width: 1.5; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .label { font: 13px Arial, sans-serif; fill: #334155; font-weight: 600; }
      .connector { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .connector-text { font: 700 14px Arial, sans-serif; fill: #1e40af; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="2220" class="page" />
  <text x="590" y="46" text-anchor="middle" class="title">Luồng admin tạo combo sản phẩm</text>

  <g id="lanes">
    <rect x="40" y="80" width="340" height="60" class="lane-head" />
    <rect x="380" y="80" width="420" height="60" class="lane-head" />
    <rect x="800" y="80" width="340" height="60" class="lane-head" />
    <text x="210" y="116" text-anchor="middle" class="lane-title">Quản trị viên</text>
    <text x="590" y="116" text-anchor="middle" class="lane-title">Giao diện quản trị</text>
    <text x="970" y="116" text-anchor="middle" class="lane-title">Hệ thống Fruitables</text>

    <rect x="40" y="140" width="340" height="2040" class="lane-body" />
    <rect x="380" y="140" width="420" height="2040" class="lane-alt" />
    <rect x="800" y="140" width="340" height="2040" class="lane-body" />
  </g>

  <circle cx="210" cy="180" r="12" class="start-end" />

  <g id="admin-actions">
    <rect x="90" y="220" width="240" height="62" rx="8" class="node" />
    <text x="210" y="244" text-anchor="middle" class="text">Chọn menu</text>
    <text x="210" y="263" text-anchor="middle" class="small">Combo sản phẩm</text>

    <rect x="90" y="650" width="240" height="62" rx="8" class="node" />
    <text x="210" y="674" text-anchor="middle" class="text">Bấm nút</text>
    <text x="210" y="693" text-anchor="middle" class="small">Thêm combo</text>

    <rect x="90" y="1110" width="240" height="74" rx="8" class="node" />
    <text x="210" y="1135" text-anchor="middle" class="text">Nhập thông tin combo</text>
    <text x="210" y="1154" text-anchor="middle" class="small">tên, mô tả, ảnh, trạng thái</text>
    <text x="210" y="1173" text-anchor="middle" class="small">sản phẩm và số lượng</text>

    <rect x="90" y="1230" width="240" height="62" rx="8" class="node" />
    <text x="210" y="1254" text-anchor="middle" class="text">Bấm Lưu combo</text>
    <text x="210" y="1273" text-anchor="middle" class="small">để gửi dữ liệu</text>

    <path d="M210 1530 L330 1590 L210 1650 L90 1590 Z" class="decision" />
    <text x="210" y="1585" text-anchor="middle" class="text">Tiếp tục</text>
    <text x="210" y="1604" text-anchor="middle" class="text">chỉnh sửa?</text>

    <rect x="90" y="1670" width="240" height="62" rx="8" class="node" />
    <text x="210" y="1694" text-anchor="middle" class="text">Chỉnh sửa thông tin</text>
    <text x="210" y="1713" text-anchor="middle" class="small">rồi bấm Lưu lại</text>

    <circle cx="210" cy="1760" r="17" class="connector" />
    <text x="210" y="1765" text-anchor="middle" class="connector-text">B</text>

    <rect x="90" y="1790" width="240" height="62" rx="8" class="node" />
    <text x="210" y="1814" text-anchor="middle" class="text">Xem combo vừa tạo</text>
    <text x="210" y="1833" text-anchor="middle" class="small">trong danh sách</text>
    <path d="M210 1870 L330 1930 L210 1990 L90 1930 Z" class="decision" />
    <text x="210" y="1925" text-anchor="middle" class="text">Tạo tiếp</text>
    <text x="210" y="1944" text-anchor="middle" class="text">combo khác?</text>

    <rect x="90" y="2015" width="240" height="62" rx="8" class="node" />
    <text x="210" y="2039" text-anchor="middle" class="text">Bấm nút Thêm combo</text>
    <text x="210" y="2058" text-anchor="middle" class="small">để tạo combo mới</text>

    <circle cx="210" cy="2110" r="17" class="connector" />
    <text x="210" y="2115" text-anchor="middle" class="connector-text">A</text>
  </g>

  <g id="ui-actions">
    <rect x="470" y="320" width="240" height="62" rx="8" class="ui-node" />
    <text x="590" y="344" text-anchor="middle" class="text">Hiển thị màn hình</text>
    <text x="590" y="363" text-anchor="middle" class="small">quản lý combo</text>

    <rect x="470" y="540" width="240" height="74" rx="8" class="ui-node" />
    <text x="590" y="565" text-anchor="middle" class="text">Hiển thị bảng combo</text>
    <text x="590" y="584" text-anchor="middle" class="small">và các nút Thêm, Sửa, Xóa</text>
    <text x="590" y="603" text-anchor="middle" class="small">cho quản trị viên</text>

    <rect x="470" y="760" width="240" height="62" rx="8" class="ui-node" />
    <text x="590" y="784" text-anchor="middle" class="text">Hiển thị form</text>
    <text x="590" y="803" text-anchor="middle" class="small">tạo combo mới</text>

    <circle cx="745" cy="791" r="17" class="connector" />
    <text x="745" y="796" text-anchor="middle" class="connector-text">A</text>

    <rect x="470" y="980" width="240" height="82" rx="8" class="ui-node" />
    <text x="590" y="1005" text-anchor="middle" class="text">Hiển thị ô nhập</text>
    <text x="590" y="1024" text-anchor="middle" class="small">và dropdown chọn sản phẩm,</text>
    <text x="590" y="1043" text-anchor="middle" class="small">biến thể, số lượng</text>

    <rect x="470" y="1340" width="240" height="62" rx="8" class="ui-node" />
    <text x="590" y="1364" text-anchor="middle" class="text">Gửi dữ liệu combo</text>
    <text x="590" y="1383" text-anchor="middle" class="small">lên hệ thống</text>

    <rect x="470" y="1535" width="240" height="82" rx="8" class="ui-node" />
    <text x="590" y="1560" text-anchor="middle" class="text">Hiển thị lại form</text>
    <text x="590" y="1579" text-anchor="middle" class="small">giữ dữ liệu đã nhập</text>
    <text x="590" y="1598" text-anchor="middle" class="small">và hiển thị lỗi</text>

    <rect x="470" y="1790" width="240" height="74" rx="8" class="ui-node" />
    <text x="590" y="1815" text-anchor="middle" class="text">Hiển thị thông báo</text>
    <text x="590" y="1834" text-anchor="middle" class="small">tạo combo thành công</text>
    <text x="590" y="1853" text-anchor="middle" class="small">và bảng đã cập nhật</text>
  </g>

  <g id="system-actions">
    <rect x="850" y="420" width="240" height="74" rx="8" class="system-node" />
    <text x="970" y="445" text-anchor="middle" class="text">Lấy danh sách combo</text>
    <text x="970" y="464" text-anchor="middle" class="small">và tính tổng giá hiện tại</text>
    <text x="970" y="483" text-anchor="middle" class="small">của từng combo</text>

    <rect x="850" y="870" width="240" height="74" rx="8" class="system-node" />
    <text x="970" y="895" text-anchor="middle" class="text">Lấy danh sách</text>
    <text x="970" y="914" text-anchor="middle" class="small">sản phẩm và biến thể</text>
    <text x="970" y="933" text-anchor="middle" class="small">đang bán</text>

    <rect x="850" y="1440" width="240" height="62" rx="8" class="system-node" />
    <text x="970" y="1464" text-anchor="middle" class="text">Kiểm tra dữ liệu</text>
    <text x="970" y="1483" text-anchor="middle" class="small">combo gửi lên</text>

    <path d="M970 1530 L1090 1590 L970 1650 L850 1590 Z" class="decision" />
    <text x="970" y="1585" text-anchor="middle" class="text">Dữ liệu</text>
    <text x="970" y="1604" text-anchor="middle" class="text">hợp lệ?</text>

    <rect x="850" y="1790" width="240" height="62" rx="8" class="system-node" />
    <text x="970" y="1814" text-anchor="middle" class="text">Lưu combo</text>
    <text x="970" y="1833" text-anchor="middle" class="small">và danh sách sản phẩm</text>
  </g>

  <g id="end">
    <circle cx="58" cy="1590" r="14" class="end-ring" />
    <circle cx="58" cy="1590" r="7" class="start-end" />
    <circle cx="58" cy="1930" r="14" class="end-ring" />
    <circle cx="58" cy="1930" r="7" class="start-end" />
  </g>

  <g id="arrows">
    <path class="arrow" d="M210 192 L210 220" />
    <path class="arrow" d="M210 282 C210 315 470 295 590 320" />
    <path class="arrow" d="M590 382 C590 420 850 394 970 420" />
    <path class="arrow" d="M970 494 C970 535 710 515 590 540" />
    <path class="arrow" d="M590 614 C590 645 330 625 210 650" />
    <path class="arrow" d="M210 712 C210 752 470 735 590 760" />
    <path class="arrow" d="M590 822 C590 865 850 845 970 870" />
    <path class="arrow" d="M970 944 C970 982 710 955 590 980" />
    <path class="arrow" d="M590 1062 C590 1100 330 1085 210 1110" />
    <path class="arrow" d="M210 1184 L210 1230" />
    <path class="arrow" d="M210 1292 C210 1330 470 1315 590 1340" />
    <path class="arrow" d="M590 1402 C590 1440 850 1418 970 1440" />
    <path class="arrow" d="M970 1502 L970 1530" />
    <path class="arrow" d="M850 1590 C790 1590 765 1576 710 1576" />
    <text x="785" y="1560" class="label">Không</text>
    <path class="arrow" d="M470 1576 L330 1590" />
    <path class="arrow" d="M90 1590 L73 1590" />
    <text x="76" y="1566" class="label">Không</text>
    <path class="arrow" d="M210 1650 L210 1670" />
    <text x="225" y="1665" class="label">Có</text>
    <path class="arrow" d="M210 1732 L210 1743" />
    <circle cx="60" cy="1261" r="17" class="connector" />
    <text x="60" y="1266" text-anchor="middle" class="connector-text">B</text>
    <path class="arrow" d="M77 1261 L90 1261" />
    <path class="arrow" d="M970 1650 L970 1790" />
    <text x="990" y="1710" class="label">Có</text>
    <path class="arrow" d="M850 1821 C792 1821 765 1827 710 1827" />
    <path class="arrow" d="M470 1827 L330 1827" />
    <path class="arrow" d="M210 1852 L210 1870" />
    <path class="arrow" d="M90 1930 L73 1930" />
    <text x="76" y="1906" class="label">Không</text>
    <path class="arrow" d="M210 1990 L210 2015" />
    <text x="225" y="2007" class="label">Có</text>
    <path class="arrow" d="M210 2077 L210 2093" />
    <path class="arrow" d="M728 791 L710 791" />
  </g>
</svg>
