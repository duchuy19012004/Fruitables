name: CI/CD Production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Tests/Fruitables.Tests.csproj

      - name: Test
        run: dotnet test Tests/Fruitables.Tests.csproj --no-restore --verbosity minimal

      - name: Publish
        run: dotnet publish Fruitables.csproj -c Release --no-restore --no-self-contained -o ./publish

      - name: Verify publish output
        shell: bash
        run: |
          test -f publish/Fruitables.dll
          test -f publish/web.config

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.PLESK_FTP_SERVER }}
          username: ${{ secrets.PLESK_FTP_USERNAME }}
          password: ${{ secrets.PLESK_FTP_PASSWORD }}
          protocol: ftps
          security: strict
          port: 21
          local-dir: ./publish/
          server-dir: ${{ secrets.PLESK_FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/appsettings*.json
            **/App_Data/**
            **/logs/**
            **/wwwroot/uploads/**
            **/.ftp-deploy-sync-state.json
